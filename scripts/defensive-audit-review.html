<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>防御设计逐点审批台账</title>
<style>
body{font:15px/1.6 system-ui,sans-serif;background:#faf9f6;color:#292725;margin:0}header,main{max-width:1250px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 12px}p{margin:8px 0}button,select,input{font:inherit;padding:8px 10px;border:1px solid #bbb;border-radius:6px;background:white;color:inherit}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input{flex:1;min-width:220px}.note{color:#665f57}.card{background:white;padding:18px;border:1px solid #dedbd5;border-radius:10px;margin:12px 0}.title{display:flex;justify-content:space-between;gap:12px;align-items:center}.id{font-family:monospace;color:#8b452a;font-weight:bold}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f3ef;padding:12px;border-radius:6px;max-height:600px;overflow:auto;font:13px/1.6 Consolas,monospace}.meta{font-size:13px;color:#676059}.tag{background:#eee9df;padding:3px 7px;border-radius:4px;margin-right:5px}details{margin:8px 0}summary{cursor:pointer}textarea{width:100%;box-sizing:border-box;min-height:55px;margin-top:8px;font:inherit}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}nav{display:flex;gap:8px;align-items:center}.danger{color:#944129}a{color:#7a412c}
</style>
<header>
<h1>防御设计逐点审批台账</h1>
<p id="totals">正在读取本地扫描数据…</p>
<p class="note">按必要性从低到高：人工建议移除 → 额外限制/阈值初判 → 未定候选 → 完整性/权限初判 → 人工建议保留。初判不等于人工逐条确认；普通业务分支和测试断言也保留，以便检查遗漏。</p>
<p class="note">一个限制可以出现于 if、throw 和多个子条件，记录之间不等于不同设计数量。复合条件子项可独立标注意见，但实施时须结合父逻辑。审批不会执行任何源码修改。</p>
<div class="controls">
<input id="query" placeholder="搜索编号、目录、函数、错误码或条件">
<select id="scope"><option value="product">产品源码</option><option value="all">全部（含测试和脚本）</option><option value="tooling">安装/开发脚本</option><option value="verification">测试/验证脚本</option><option value="repository">仓库配置</option></select>
<select id="layer"><option value="action">拦截/保护动作候选</option><option value="manual">已有人工设计判断</option><option value="all">全部（含条件和待核实候选）</option><option value="condition">条件子项</option><option value="candidate">其它待核实候选</option></select>
<select id="kind"><option value="all">全部语法点</option></select>
<select id="status"><option value="all">全部审批状态</option><option>待审批</option><option>移除</option><option>保留</option><option>改为可配置</option><option>修改方案</option><option>非防御/无需审批</option><option>待核实</option></select>
<button id="search">应用筛选</button><button id="export">导出审批 JSON</button><button id="import">导入审批 JSON</button><input id="importFile" type="file" accept=".json" hidden>
</div>
<p id="storage" class="note"></p>
<details><summary>覆盖范围、排除项和文件清单</summary><p id="coverage"></p><button id="files">显示/隐藏文件明细</button><div id="manifest" hidden></div></details>
<p><a href="approval.csv">完整 CSV</a> · <a href="ledger.json">完整 JSON 台账</a> · <a href="summary.json">扫描统计</a></p>
</header>
<main><nav><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav><div id="cards"></div></main>
<script src="review-data.js"></script>
<script>
const data=window.AUDIT_DATA,rows=data.records,byId=new Map(rows.map(r=>[r.id,r])),$=id=>document.getElementById(id),size=30;
const decisionOptions=['待审批','移除','保留','改为可配置','修改方案','非防御/无需审批','待核实'];
const names={'manual-review':'人工设计定位','if':'条件分支','condition-part':'复合条件子项','conditional':'三元条件','short-circuit':'短路/默认值','throw':'抛错拒绝','catch':'异常处理','return':'返回/早退','loop-exit':'循环跳过/中止','loop-condition':'循环条件','switch-branch':'分派分支','policy-call':'校验/限制相关调用','policy-value':'策略配置值','ui-constraint':'界面限制','filter':'列表过滤','embedded-code':'嵌入脚本/指令','instruction-policy':'指令约束','line-candidate':'配置/其它语言候选','assert':'断言'};
let choices={},filtered=[],page=0;const storageKey='awb-defensive-review-v2';
try{choices=JSON.parse(localStorage.getItem(storageKey)||'{}');$('storage').textContent='审批暂存在本浏览器本地；请导出 JSON 作为可提交的审批结果。';}catch{$('storage').textContent='本浏览器不提供本地存储；关闭前请导出审批 JSON。';}
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
function save(){try{localStorage.setItem(storageKey,JSON.stringify(choices));}catch{$('storage').textContent='本地存储不可写，请导出审批 JSON。';}}
function selectDecision(r){const s=el('select');for(const option of decisionOptions)s.append(el('option',option));s.value=choices[r.id]?.decision||'待审批';s.onchange=()=>{choices[r.id]={...(choices[r.id]||{}),decision:s.value,file:r.file,line:r.line};save();};return s;}
function detail(label,text){const d=el('details');d.append(el('summary',label),el('pre',text||'（无独立条件；见父分支/源码）'));return d;}
function render(){
 $('cards').replaceChildren();const start=page*size;$('page').textContent=`${filtered.length.toLocaleString()} 条匹配 · 第 ${page+1}/${Math.max(1,Math.ceil(filtered.length/size))} 页`;$('prev').disabled=page===0;$('next').disabled=start+size>=filtered.length;
 for(const r of filtered.slice(start,start+size)){
  const card=el('article',undefined,'card'),top=el('div',undefined,'title'),left=el('div');left.append(el('span',r.id+' · ','id'),el('strong',r.category));top.append(left,selectDecision(r));card.append(top);
  card.append(el('p',`${r.file}:${r.line}:${r.column||1} · ${r.function} · ${names[r.kind]||r.kind}`,'meta'));
  card.append(el('p',r.evidence+(r.prior.length?' · 原总览 '+r.prior.join(', '):''),'note'));
  card.append(el('p','建议：'+r.advice),el('p','影响：'+r.impact));
  if(r.reviews?.length)card.append(detail('本位置关联的全部人工设计判断',r.reviews.map(v=>`${v.id} ${v.title}\n现状：${v.behavior}\n建议：${v.judgment}\n影响：${v.impact}`).join('\n\n')));
  if(r.parent){const b=el('button','查看父条件 '+r.parent);b.onclick=()=>{const p=byId.get(r.parent);if(p){$('query').value=p.id;$('kind').value='all';$('layer').value='all';apply();}};card.append(b);}
  card.append(detail(r.kind==='manual-review'?'人工定位片段（具体行为见下方现状和上下文）':'触发条件（完整表达式）',r.condition),detail('动作/返回/降级',r.effect),detail('该语法点完整源码',r.code));
  const context=el('details');context.append(el('summary','展开上下文（源码快照）'));context.ontoggle=()=>{if(context.open&&context.childElementCount===1){const lines=data.sources[r.file].split('\n'),first=Math.max(0,r.line-6),last=Math.min(lines.length,Math.max(r.endLine,r.line)+5);context.append(el('pre',lines.slice(first,last).map((line,i)=>`${first+i+1}: ${line}`).join('\n')));}};card.append(context);
  if(r.enclosingConditions.length)card.append(detail('外层条件（仅表达式，不代表所有条件都为 true）',r.enclosingConditions.join('\n')));
  const note=el('textarea');note.placeholder='此项审批补充说明';note.value=choices[r.id]?.note||'';note.onchange=()=>{choices[r.id]={...(choices[r.id]||{}),decision:choices[r.id]?.decision||'待审批',note:note.value,file:r.file,line:r.line};save();};card.append(note);$('cards').append(card);
 }
}
function apply(){const q=$('query').value.toLowerCase().trim(),scope=$('scope').value,kind=$('kind').value,status=$('status').value,layer=$('layer').value;filtered=rows.filter(r=>(scope==='all'||r.scope===scope)&&(layer==='all'||(layer==='manual'?r.reviews?.length:r.layer===layer))&&(kind==='all'||r.kind===kind)&&(status==='all'||(choices[r.id]?.decision||'待审批')===status)&&(!q||(/^(?:d[0-9]+|f[0-9a-f]{12})$/.test(q)?r.id.toLowerCase()===q||r.prior.some(id=>id.toLowerCase()===q):[r.id,r.file,r.function,r.category,r.condition,r.effect,r.code,...r.prior].some(t=>String(t).toLowerCase().includes(q)))));page=0;render();}
for(const kind of Object.keys(data.summary.kinds).sort()){$('kind').append(Object.assign(el('option',`${names[kind]||kind} (${data.summary.kinds[kind]})`),{value:kind}));}
$('totals').textContent=`基线 ${data.summary.head.slice(0,12)} · ${data.summary.files} 个文件清单 · ${rows.length.toLocaleString()} 个可定位记录（不是独立设计数）`;
$('coverage').textContent=`语法解析错误：${data.summary.parseErrors.length}；扫描后变化文件：${data.summary.changedSinceScan.length}；未定位人工条目：${data.summary.unresolvedReviews.length}。每个文件都记录哈希和解析方式；非源码文件明确列为排除。嵌入脚本、C#/PowerShell/配置为候选行，不冒称 AST 完整解析。`;
$('search').onclick=apply;$('query').onkeydown=e=>{if(e.key==='Enter')apply();};for(const id of ['scope','layer','kind','status'])$(id).onchange=apply;
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({head:data.summary.head,decisions:choices},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='defensive-review-decisions.json';a.click();URL.revokeObjectURL(url);};
$('import').onclick=()=>{$('importFile').click();};$('importFile').onchange=async()=>{const file=$('importFile').files[0];if(!file)return;try{const value=JSON.parse(await file.text());let accepted=0;for(const [id,item]of Object.entries(value.decisions||{}))if(byId.has(id)&&decisionOptions.includes(item.decision)){choices[id]=item;accepted++;}save();apply();$('storage').textContent=`已导入 ${accepted} 项审批；未执行任何代码修改。`;}catch{$('storage').textContent='审批文件无法解析，现有记录未清空。';}};
$('files').onclick=()=>{const box=$('manifest');box.hidden=!box.hidden;if(!box.hidden&&!box.childElementCount){const table=el('table');const head=el('tr');for(const t of ['文件','范围','方法','记录数','SHA-256'])head.append(el('th',t));table.append(head);for(const f of data.manifest){const tr=el('tr');for(const text of [f.file,f.scope,f.method,f.count||0,f.sha256])tr.append(el('td',String(text)));table.append(tr);}box.append(table);}};
apply();
</script></html>
